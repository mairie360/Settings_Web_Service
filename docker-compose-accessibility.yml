# Accessibility (RGAA) test stack of the settings front (MAIR-316 / MAIR-317).
#
#   ./accessibility_test.sh        (local: builds the front when IMAGE_REF is empty)
#
# Same stack as docker-compose-security.yml (database + seed, core-api, bff-settings), plus the data
# of the RGAA states (init-accessibility.sql), the front on ${IMAGE_REF} and, instead of ZAP, the
# runner of the RGAA engine of mairie360/CICD (cicd-repo/tests/a11y), which plays the states of
# rgaa.yaml and writes rgaa-report/. Each state is played logged in as its seed user, with an
# accessToken the engine signs with the JWT_SECRET below (session / users of rgaa.yaml).
# Exit codes: 0 ok, 1 state unreachable / undeclared criterion, 2 invalid rgaa.yaml,
# 3 rate below RGAA_MIN_RATE.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF Settings, puis à Core API.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

# Own project name: the default one (the folder) is shared with docker-compose.yml, whose
# postgres-data / redis-data volumes `down -v` would otherwise delete.
name: settings-front-a11y

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: settings-front-a11y-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: settings-front-a11y-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: settings-front-a11y-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  # Data of the RGAA states only (users and sessions of rgaa.yaml), after the shared seed; the ZAP / k6
  # stacks keep init-test.sql alone.
  seeder-a11y:
    image: postgres:18-alpine
    container_name: settings-front-a11y-seeder-a11y
    depends_on:
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./init-accessibility.sql:/init-accessibility.sql:ro
    environment:
      PGPASSWORD: password
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "postgres", "-d", "mairie_360_database", "-f", "/init-accessibility.sql"]
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: settings-front-a11y-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: settings-front-a11y-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # Core API >= 2.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: settings-front-a11y-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'i=0; until curl -fsS --connect-timeout 2 --max-time 5 http://core-api:3000/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 90 attempts"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-settings:
    image: ${BFF_SETTINGS_IMAGE:-ghcr.io/mairie360/bff-settings:2.1.0}
    container_name: settings-front-a11y-bff-settings
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4008
      CORE_API_URL: http://core-api:3000
      # Same secret as Core: BFF_Settings verifies the session tokens with it and refuses to start without it.
      JWT_SECRET: 'b"secret"'
    expose:
      - "4008"
    networks:
      - backend

  bff-settings-ready:
    image: curlimages/curl:latest
    container_name: settings-front-a11y-bff-settings-ready
    depends_on:
      bff-settings:
        condition: service_started
    command: >
      sh -c 'i=0; until curl -fsS --connect-timeout 2 --max-time 5 http://bff-settings:4008/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "bff-settings not ready after 90 attempts"; exit 1; fi;
      echo "waiting for bff-settings..."; sleep 2; done; echo "bff-settings ready"'
    networks:
      - backend

  settings-front:
    # The image under test: <image>@<staging digest> in the rgaa job of promote-prod.yml,
    # settings-front:local built by accessibility_test.sh otherwise. Never built here.
    image: ${IMAGE_REF:?IMAGE_REF must name the front image to test}
    container_name: settings-front-a11y-front
    depends_on:
      bff-settings-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      SETTINGS_BFF_URL: http://bff-settings:4008
      # Every URL the front reads: its own (the session guard and the server-side read of the page
      # need it), the others as reserved test destinations that are never followed.
      SETTINGS_FRONT_URL: http://settings-front:5000/
      LOGIN_FRONT_URL: http://login-front.invalid/
      DASHBOARD_FRONT_URL: http://dashboard-front.invalid/
      PROJECT_FRONT_URL: http://projects-front.invalid/
      CALENDAR_FRONT_URL: http://calendars-front.invalid/
      MESSAGE_FRONT_URL: http://messages-front.invalid/
      ELEARNING_FRONT_URL: http://elearning-front.invalid/
      ADMINISTRATION_FRONT_URL: http://administrator-front.invalid/
      COOKIE_DOMAIN: settings-front
    expose:
      - "5000"
    networks:
      - backend
    # curl est installé dans l'image runner (seul un statut >= 400 fait échouer curl -f).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  a11y:
    image: ${A11Y_RUNNER_IMAGE:?A11Y_RUNNER_IMAGE comes from cicd-repo/tests/a11y/runner-image}
    # Run as the caller (accessibility_test.sh exports them), so that rgaa-report/ and
    # .rgaa-ai-cache/ are not root-owned in the checkout.
    user: "${RGAA_UID:-0}:${RGAA_GID:-0}"
    container_name: settings-front-a11y-runner
    depends_on:
      settings-front:
        condition: service_healthy
    command: ["sh", "/engine/run.sh"]
    environment:
      # Set by the rgaa job of promote-prod.yml (rgaa_min_rate, MAIR-319; AI pre-audit, MAIR-320).
      RGAA_MIN_RATE: ${RGAA_MIN_RATE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      RGAA_AI_MODEL: ${RGAA_AI_MODEL:-}
    volumes:
      - ./cicd-repo/tests/a11y:/engine:ro
      - ./rgaa.yaml:/scope/rgaa.yaml:ro
      - ./rgaa-report:/report
      - ./.rgaa-ai-cache:/ai-cache
    networks:
      - backend
