# Accessibility (RGAA) test stack of the settings front (MAIR-316 / MAIR-317).
#
#   ./accessibility_test.sh        (local: builds the front when IMAGE_REF is empty)
#
# Same stack as docker-compose-security.yml (database + seed, core-api, bff-settings), with the
# front on ${IMAGE_REF} (staging-<sha> in the CI, release-prod job) and, instead of ZAP, the runner
# of the RGAA engine of mairie360/CICD (cicd-repo/tests/a11y), which plays the states of rgaa.yaml
# and writes rgaa-report/. Every state is played logged in as the seed user 2, with an accessToken
# the engine signs with the JWT_SECRET below (session / users of rgaa.yaml). Exit codes: 0 ok,
# 1 state unreachable / undeclared criterion, 2 invalid rgaa.yaml, 3 rate below RGAA_MIN_RATE.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF Settings, puis à Core API.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: settings-front-a11y-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: settings-front-a11y-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: settings-front-a11y-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: settings-front-a11y-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    container_name: settings-front-a11y-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: settings-front-a11y-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-settings:
    image: ${BFF_SETTINGS_IMAGE:-ghcr.io/mairie360/bff-settings:1.1.0}
    container_name: settings-front-a11y-bff-settings
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4008
      CORE_API_URL: http://core-api:3000
    expose:
      - "4008"
    networks:
      - backend

  bff-settings-ready:
    image: curlimages/curl:latest
    container_name: settings-front-a11y-bff-settings-ready
    depends_on:
      bff-settings:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-settings:4008/health >/dev/null; do
      echo "waiting for bff-settings..."; sleep 2; done; echo "bff-settings ready"'
    networks:
      - backend

  settings-front:
    # Published image (staging-<sha> in the CI); accessibility_test.sh builds one locally.
    image: ${IMAGE_REF:?IMAGE_REF must name the front image to test}
    container_name: settings-front-a11y-front
    depends_on:
      bff-settings-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      SETTINGS_BFF_URL: http://bff-settings:4008
    expose:
      - "5000"
    networks:
      - backend
    # curl est installé dans l'image runner (seul un statut >= 400 fait échouer curl -f).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  a11y:
    image: ${A11Y_RUNNER_IMAGE:?A11Y_RUNNER_IMAGE comes from cicd-repo/tests/a11y/runner-image}
    # Run as the caller (accessibility_test.sh exports them), so that rgaa-report/ and
    # .rgaa-ai-cache/ are not root-owned in the checkout.
    user: "${RGAA_UID:-0}:${RGAA_GID:-0}"
    container_name: settings-front-a11y-runner
    depends_on:
      settings-front:
        condition: service_healthy
    command: ["sh", "/engine/run.sh"]
    environment:
      RGAA_MIN_RATE: ${RGAA_MIN_RATE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      RGAA_AI_MODEL: ${RGAA_AI_MODEL:-}
    volumes:
      - ./cicd-repo/tests/a11y:/engine:ro
      - ./rgaa.yaml:/scope/rgaa.yaml:ro
      - ./rgaa-report:/report
      - ./.rgaa-ai-cache:/ai-cache
    networks:
      - backend
