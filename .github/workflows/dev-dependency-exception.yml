name: Frontend dev dependency exception

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the exact development-only advisory exception
        required: true
        type: string
        default: GHSA-vfj7-8cjw-p6xm in dev-only dependencies; retain the failed audit and require zero production findings

permissions:
  contents: read
  actions: read
  checks: read
  packages: write
  id-token: write

jobs:
  dev_exception:
    name: Dev dependency exception
    uses: mairie360/CICD/.github/workflows/frontend-dev-exception.yml@75e4fc4838ff31299b924ce0c973af620e99d8f9 # v4.4.1
    with:
      package_name: settings-front
      cicd_ref: 75e4fc4838ff31299b924ce0c973af620e99d8f9 # v4.4.1
      node_version: "24.21.0"
      reason: ${{ inputs.reason }}
